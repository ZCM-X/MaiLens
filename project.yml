name: MaiLens
options:
  bundleIdPrefix: com.mailens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_NSCameraUsageDescription: "使用后置 0.5× 摄像头实时预览并矫正外接鱼眼镜头画面。"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "录制稳定后的视频时录入机台音乐和现场声音。"
    INFOPLIST_KEY_NSMotionUsageDescription: "使用设备运动传感器模拟云台，补偿手机转动、俯仰和倾斜，并稳定录像中的地平线。"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MaiLens:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mailens.app
        PRODUCT_NAME: MaiLens
        SWIFT_EMIT_LOC_STRINGS: "YES"
