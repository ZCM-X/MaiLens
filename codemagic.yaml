workflows:
  mai-lens-ios:
    name: MaiLens unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Install Metal Toolchain
        script: xcodebuild -downloadComponent MetalToolchain
      - name: Export Core ML machine detector
        script: |
          python3 -m venv .codemagic-mailens-python
          .codemagic-mailens-python/bin/python -m pip install --upgrade pip
          # Ultralytics 8.3.0 + Core ML Tools 8.3.0 is the compatible
          # TorchScript exporter for this YOLO11n weight. Newer torch/coremltools
          # pairs currently fail in the Core ML MIL converter on CodeMagic.
          .codemagic-mailens-python/bin/python -m pip install \
            ultralytics==8.3.0 \
            coremltools==8.3.0 \
            numpy==2.3.5 \
            torch==2.5.0 \
            torchvision==0.20.0
          .codemagic-mailens-python/bin/python Training/export_coreml.py \
            --weights Training/models/machine-lock-yolo11n-video.pt \
            --output Resources/MachineDetector.mlpackage
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Archive unsigned iOS app
        script: xcodebuild -project MaiLens.xcodeproj -scheme MaiLens -destination 'generic/platform=iOS' -configuration Release -archivePath build/MaiLens.xcarchive -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/staging/Payload
          cp -R build/MaiLens.xcarchive/Products/Applications/MaiLens.app build/ios/ipa/staging/Payload/
          cd build/ios/ipa/staging
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../MaiLens-unsigned.ipa
    artifacts:
      - build/ios/ipa/MaiLens-unsigned.ipa
