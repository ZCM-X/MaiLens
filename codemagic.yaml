workflows:
  mai-lens-ios:
    name: MaiLens unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Install Metal Toolchain
        script: xcodebuild -downloadComponent MetalToolchain
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      - name: Archive unsigned iOS app
        script: xcodebuild -project MaiLens.xcodeproj -scheme MaiLens -destination 'generic/platform=iOS' -configuration Release -archivePath build/MaiLens.xcarchive -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/staging/Payload
          cp -R build/MaiLens.xcarchive/Products/Applications/MaiLens.app build/ios/ipa/staging/Payload/
          cd build/ios/ipa/staging
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ../MaiLens-unsigned.ipa
    artifacts:
      - build/ios/ipa/MaiLens-unsigned.ipa
